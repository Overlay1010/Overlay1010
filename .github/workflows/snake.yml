name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 1회 갱신
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#36BCF7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#36BCF7&color_dots=#161b22,#0e3a52,#14628a,#1f8fc4,#36bcf7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
